<title>Rong Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@400;600;800&family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;700&family=Galada&family=Atma:wght@400;600&family=Mina:wght@400;700&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Pacifico&family=Oswald:wght@400;700&family=Caveat:wght@400;700&family=Montserrat:wght@400;700;900&family=Lobster&family=Anek+Bangla:wght@400;600;800&family=Poppins:wght@400;600;800&family=Roboto:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen editor — top bar, stage, tool panel, tab rail (bottom on phone, left rail + right panel on desktop) */
:root{
  --bg:#141210; --panel:#1c1916; --raise:#262220; --raise2:#302b27; --line:#38322c;
  --fg:#f2ece4; --muted:#a39a8e; --accent:#f2b42c; --accent-ink:#1b1406; --accent-soft:rgba(242,180,44,.14);
  --danger:#f0715f; --stage:#0d0c0a; --check:#1d1a17; --shadow:rgba(0,0,0,.5);
  --ui:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand:"Galada","Hind Siliguri",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f1f0ec; --panel:#fbfaf8; --raise:#ecebe6; --raise2:#e2e0da; --line:#d8d5cd;
  --fg:#1d1b17; --muted:#6e685e; --accent:#b8780e; --accent-ink:#ffffff; --accent-soft:rgba(184,120,14,.12);
  --danger:#c2412f; --stage:#dddad3; --check:#cbc8c0; --shadow:rgba(40,30,10,.18); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f1f0ec; --panel:#fbfaf8; --raise:#ecebe6; --raise2:#e2e0da; --line:#d8d5cd;
  --fg:#1d1b17; --muted:#6e685e; --accent:#b8780e; --accent-ink:#ffffff; --accent-soft:rgba(184,120,14,.12);
  --danger:#c2412f; --stage:#dddad3; --check:#cbc8c0; --shadow:rgba(40,30,10,.18); color-scheme:light; }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "stage" "tabs";overflow:hidden}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:auto;min-width:0}
.brand b{font-family:var(--brand);font-weight:400;font-size:26px;color:var(--accent);line-height:1}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--fg)}
.ib:hover{background:var(--raise)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--raise2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.vsep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* stage */
.stage-wrap{grid-area:stage;position:relative;min-height:0;background:var(--stage)}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.stage .canvas-container{touch-action:none;
  background-color:var(--check);background-image:conic-gradient(var(--raise2) 25%,transparent 0 50%,var(--raise2) 0 75%,transparent 0);background-size:16px 16px}
.stage.drop{outline:3px dashed var(--accent);outline-offset:-8px}
.floatbar{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 24px var(--shadow);z-index:5;max-width:calc(100% - 76px);overflow-x:auto}
.floatbar .ib{width:36px;height:36px}
.floatbar .ib.del{color:var(--danger)}
.zoom{position:absolute;right:calc(var(--sheetR,0px) + max(10px,env(safe-area-inset-right,0px)));top:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line);z-index:5}
.zoom .ib{width:32px;height:32px}
.zoom output{min-width:40px;padding:2px 0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 150px);padding:6px 6px 6px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);z-index:5;font-size:13px}
.chip span{color:var(--muted);min-width:0}
.chip strong{color:var(--fg);font-weight:600}

/* panel */
/* tool sheet: docked (drag its top edge to resize) or floating (drag anywhere) */
.sheet{position:absolute;z-index:20;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);box-shadow:0 -6px 28px var(--shadow);min-height:0;min-width:0}
.sheet.dock{border-radius:18px 18px 0 0;border-bottom:0}
.sheet.side{border-radius:0;border-top:0;border-right:0;border-bottom:0;box-shadow:none}
.sheet.float{border-radius:16px;box-shadow:0 14px 44px var(--shadow)}
.sheet.drag{transition:none!important;opacity:.97}
.sheet-head{position:relative;display:flex;align-items:center;gap:4px;padding:14px 6px 6px max(16px,env(safe-area-inset-left,0px));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;flex:none}
.sheet.side .sheet-head{padding-top:10px;cursor:default}
.sheet-head:active{cursor:grabbing}
.grip{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:44px;height:5px;border-radius:3px;background:var(--line)}
.sheet.side .grip{display:none}
.sheet-title{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .ib{width:36px;height:36px}
.sheet-resize{position:absolute;right:0;bottom:0;width:30px;height:30px;touch-action:none;cursor:nwse-resize;display:none}
.sheet.float .sheet-resize{display:block}
.sheet-resize::after{content:"";position:absolute;right:7px;bottom:7px;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);border-radius:0 0 3px 0}
.panel{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
  padding-block:4px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pin{display:flex;flex-direction:column;gap:18px}
.pin>.sec:first-child>.pt:first-child{display:none}
.sec{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em;font-weight:500}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pt{font-size:17px;font-weight:600}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:center;font-size:13px;line-height:1.25}
.tile:hover{background:var(--raise2);border-color:var(--muted)}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile .big{font-size:22px;line-height:1.1}
.tile svg.shp{width:34px;height:34px}
.tile svg.shp *{fill:var(--accent);stroke:none}
.tile svg.shp .ol{fill:none;stroke:var(--accent);stroke-width:2.5}
.wide{grid-column:1/-1}
.txtp{min-height:64px;justify-content:center;align-items:flex-start;text-align:left;padding:10px 12px}
.txtp small{color:var(--muted);font-family:var(--ui);font-size:11px}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--raise)}
.lrow.on{border-color:var(--accent);background:var(--accent-soft)}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:4px 0}
.lrow .ty{color:var(--muted);font-size:12px}
.lrow .ib{width:32px;height:32px}
.lrow.off .nm{opacity:.45}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.size{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);text-align:left}
.size em{font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.size.on{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rng{display:grid;grid-template-columns:96px minmax(0,1fr) 48px;align-items:center;gap:10px}
.rng label{color:var(--muted);font-size:13px}
.rng output{text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.sws{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel) inset}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45% 55%,transparent 55%),var(--raise)}
.sw.pick{overflow:hidden;background:conic-gradient(#f44,#fd4,#4d6,#4cf,#64f,#f4c,#f44)}
.sw.drop{display:inline-grid;place-items:center;background:var(--raise);color:var(--fg)}
.sw.drop svg.i{width:16px;height:16px}
.sw.drop.on{background:var(--accent);color:var(--accent-ink)}
.sw.pick input{position:absolute;inset:-6px;opacity:0;width:calc(100% + 12px);height:calc(100% + 12px);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:transparent;height:34px;min-width:40px;padding:0 10px;display:inline-grid;place-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
select,textarea,input[type=number],input[type=text]{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;box-sizing:border-box;resize:vertical;line-height:1.5}
select{box-sizing:border-box}
select{height:38px;width:100%}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{color:var(--muted);font-size:13px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px}
.switch{width:44px;height:26px;border-radius:13px;border:0;background:var(--raise2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--accent-ink)}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pre{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:0;font-size:12px;color:var(--muted)}
.pre canvas{width:62px;height:62px;border-radius:10px;border:2px solid transparent;background:var(--raise)}
.pre.on canvas{border-color:var(--accent)}
.pre.on{color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dims{display:flex;align-items:center;gap:8px}
.dims input{width:90px}

/* smart edit */
.status{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--raise);border:1px solid var(--line);font-size:13px;line-height:1.5}
.status.ok{border-color:var(--accent);background:var(--accent-soft)}
.status.err{border-color:var(--danger)}
.status b{display:block;font-size:14px}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px}
.status.ok .dot{background:var(--accent)}
.status.err .dot{background:var(--danger)}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raise);text-align:left}
.bigbtn:hover{background:var(--raise2)}
.bigbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bigbtn b{display:block;font-weight:600}
.bigbtn small{display:block;font-size:12px;opacity:.75}
.bigbtn:disabled{opacity:.5;cursor:default}
.busy{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.35);padding:16px}
.busy .card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px var(--shadow);max-width:340px}
.busy .card p{margin:0;font-size:13px;color:var(--muted)}
.busy .card b{display:block;font-size:14px;color:var(--fg)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--raise2);border-top-color:var(--accent);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* chat photos & paste */
.ph-t{padding:6px;min-height:0;gap:4px}
.ph-t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--raise2);max-width:100%}
.ph-t span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pastebox{min-height:52px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5;overflow:hidden;max-height:90px}
.pastebox:focus{border-color:var(--accent);outline:none;color:var(--fg)}
.pastebox img{max-height:60px}
/* top bar new image */
.newimg{margin-right:4px}
/* file pick overlay */
.filebtn{position:relative;overflow:hidden}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;z-index:2}

/* desktop: menu bar, layers dock */
.menubar{display:none;align-items:center;gap:2px;margin-left:10px}
.menubar>div{position:relative}
.mb{height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--fg);font-weight:500}
.mb:hover,.mb.on{background:var(--raise)}
.menu{position:absolute;left:0;top:36px;z-index:70;min-width:260px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 44px var(--shadow);display:flex;flex-direction:column}
.mi{display:flex;align-items:center;justify-content:space-between;gap:24px;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;text-align:left;color:var(--fg);white-space:nowrap}
.mi:hover{background:var(--accent-soft)}
.mi kbd{font:12px ui-monospace,Consolas,monospace;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.layersdock{flex:none;max-height:38%;overflow:auto;border-top:1px solid var(--line);padding:10px 14px 14px}
.layersdock .lrow{padding:3px 4px 3px 10px}
.layersdock .lrow .ib{width:28px;height:28px}
.layersdock .lrow .ib svg.i{width:16px;height:16px}
.toolhint{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;z-index:5;padding:6px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (min-width:900px){ .menubar{display:flex} .brand span{display:none} }
/* tabs */
.tabs{grid-area:tabs;display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);
  padding-block:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tab{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:16px}
.mbox{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mbox img{display:block;max-height:42vh;margin:0 auto;border-radius:8px;background-color:var(--check);background-image:conic-gradient(var(--raise2) 25%,transparent 0 50%,var(--raise2) 0 75%,transparent 0);background-size:14px 14px;-webkit-touch-callout:default}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.note{padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:500;box-shadow:0 8px 30px var(--shadow);max-width:calc(100% - 32px);text-align:center}

@media (min-width:900px){
  .app{grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "tabs stage"}
  .tabs{flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:10px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));overflow-y:auto}
  .tab{flex:none;padding:10px 4px}
  .panel{padding:4px 18px 24px;padding-right:max(18px,env(safe-area-inset-right,0px))}
  .toast{bottom:28px}
}
@media (max-width:640px){ .chip{display:none} }
@media (max-width:420px){ .brand span{display:none} .btn .lbl{display:none} .rng{grid-template-columns:78px minmax(0,1fr) 40px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app">
  <header class="top">
    <div class="brand" style="margin-right:0"><b>রং</b><span>ছবি সম্পাদক</span></div>
    <nav class="menubar" id="menubar" aria-label="মেনু"></nav>
    <span style="margin-right:auto"></span>
    <button class="btn sm newimg" data-a="newImg" aria-label="নতুন ছবি খুলুন" title="নতুন ছবি খুলুন"><span id="newIc"></span><span class="lbl">নতুন ছবি</span></button>
    <button class="ib" id="undo" aria-label="আনডু" title="আনডু (Ctrl+Z)"></button>
    <button class="ib" id="redo" aria-label="রিডু" title="রিডু (Ctrl+Y)"></button>
    <div class="vsep"></div>
    <button class="btn primary" id="exportBtn"><span id="dlIc"></span><span class="lbl">সেভ করুন</span></button>
  </header>

  <main class="stage-wrap">
    <div class="stage" id="stage"><canvas id="c"></canvas></div>
    <div class="floatbar" id="bar" hidden></div>
    <div class="busy" id="busy" hidden><div class="card"><div class="spin"></div><div><b id="busyT">লেখা খুঁজছি…</b><p id="busyP">ছবির লেখা ও লোগো আলাদা করা হচ্ছে। ৩০–৬০ সেকেন্ড লাগতে পারে।</p></div><button class="btn sm" id="busyStop">থামান</button></div></div>
    <div class="chip" id="chip"><span><strong>নমুনা পোস্টার।</strong> যেকোনো লেখায় চাপ দিয়ে বদলে দেখুন</span><button class="btn sm primary" data-a="openBase">নিজের ছবি</button></div>

function act(a){

  else if(a==='dup'){ if(!ts.length) return; canvas.discardActiveObject(); const made=[];let n=ts.length;
    ts.forEach(t=>t.clone(c=>{ const p=t.getCenterPoint(); c.set({originX:'center',originY:'center'}); c.setPositionByOrigin(new fabric.Point(p.x+24*K(),p.y+24*K()),'center','center'); canvas.add(c);made.push(c);
      if(--n===0){ canvas.setActiveObject(made.length>1?new fabric.ActiveSelection(made,{canvas}):made[0]);canvas.requestRenderAll(); } },PROPS)); }
  else if(a==='fwd'&&o){ canvas.bringForward(o); }
  else if(a==='bwd'&&o){ const objs=canvas.getObjects();const first=ts[0];const idx=objs.indexOf(first);const b=base();
    if(b&&idx<=1){toast('মূল ছবির নিচে নেওয়া যাবে না');return} canvas.sendBackwards(o); }
  else if(a==='front'&&o){ canvas.bringToFront(o); }
  else if(a==='back'&&o){ ts.slice().reverse().forEach(t=>{canvas.sendToBack(t)}); const b=base(); if(b) canvas.sendToBack(b); }
  else if(a==='edit'){ openSheet(); return; }
  else if(a==='flipX'){ ts.forEach(t=>t.set('flipX',!t.flipX)); }
  else if(a==='flipY'){ ts.forEach(t=>t.set('flipY',!t.flipY)); }
  else if(a==='lock'){ const v=!ts.every(t=>t.locked); ts.forEach(t=>setLocked(t,v)); toast(v?'লক করা হয়েছে':'লক খোলা হয়েছে'); }
  else if(a==='cH'||a==='cV'){ ts.forEach(t=>{const c=t.getCenterPoint();t.setPositionByOrigin(new fabric.Point(a==='cH'?S.W/2:c.x,a==='cV'?S.H/2:c.y),'center','center');t.setCoords()}); if(o&&o.type==='activeSelection'){o.setCoords()} }
  else return;

}

/* ---------- filters ---------- */
function buildFilters(fx){
  const F=fabric.Image.filters,a=[];fx=fx||{};
  if(fx.brightness)a.push(new F.Brightness({brightness:fx.brightness/100*0.6}));
  if(fx.contrast)a.push(new F.Contrast({contrast:fx.contrast/100*0.6}));
  if(fx.saturation)a.push(new F.Saturation({saturation:fx.saturation/100}));
  if(fx.vibrance&&F.Vibrance)a.push(new F.Vibrance({vibrance:fx.vibrance/100}));
  if(fx.hue&&F.HueRotation)a.push(new F.HueRotation({rotation:fx.hue/180}));
  if(fx.warmth){const w=fx.warmth/100*0.16;a.push(new F.ColorMatrix({matrix:[1+w,0,0,0,0,0,1+w*0.25,0,0,0,0,0,1-w,0,0,0,0,0,1,0]}))}
  if(fx.gray)a.push(new F.Grayscale());
  if(fx.sepia)a.push(new F.Sepia());
  if(fx.invert)a.push(new F.Invert());
  if(fx.sharpen)a.push(new F.Convolute({matrix:[0,-1,0,-1,5,-1,0,-1,0]}));
  if(fx.blur)a.push(new F.Blur({blur:fx.blur/100*0.5}));
  if(fx.noise)a.push(new F.Noise({noise:fx.noise*2.5}));
  if(fx.pixelate)a.push(new F.Pixelate({blocksize:Math.round(fx.pixelate*K()*2)+1}));
  if(fx.tint)a.push(new F.BlendColor({color:fx.tint,mode:'tint',alpha:fx.tintAmt??1}));
  return a;
}
function applyFx(t){ cancelAnimationFrame(t._fxRaf); t.filters=buildFilters(t.fx); t._fxRaf=requestAnimationFrame(()=>{ t.applyFilters(); canvas.requestRenderAll(); }); }
function fxTarget(){ const o=active(); if(o&&o.type==='image') return o; return base(); }
function cssFx(fx){ fx=fx||{}; let s=''; s+=`brightness(${1+(fx.brightness||0)/170}) contrast(${1+(fx.contrast||0)/170}) saturate(${Math.max(0,1+(fx.saturation||0)/100+(fx.vibrance||0)/250)})`;
  if(fx.warmth>0)s+=` sepia(${fx.warmth/280})`; if(fx.hue)s+=` hue-rotate(${fx.hue}deg)`; if(fx.warmth<0)s+=` hue-rotate(${fx.warmth/6}deg)`;
  if(fx.gray)s+=' grayscale(1)'; if(fx.sepia)s+=' sepia(.85)'; if(fx.invert)s+=' invert(1)'; if(fx.blur)s+=` blur(${fx.blur/40}px)`; return s; }

  if(p==='canvasBg'){canvas.backgroundColor=v||'';canvas.requestRenderAll();return}
  if(p==='drawColor'){S.draw.color=v;applyBrush();return}
  if(p==='tint'||p==='tintAmt'){ targets().forEach(o=>{ if(o.type!=='image')return; o.fx={...(o.fx||{}),[p]:v||0}; if(p==='tint'&&!v){delete o.fx.tint;delete o.fx.tintAmt} applyFx(o); }); if(p==='tint')setTimeout(renderPanel,30); return; }
  targets().forEach(o=>{
    if(p==='g1'||p==='g2'){ const g=gradOf(o); if(g){ const cs=g.colorStops.map(x=>({...x})); cs[p==='g1'?0:cs.length-1].color=v; o.set('fill',makeGrad(g.coords.x2===0?'v':'h',cs[0].color,cs[cs.length-1].color)); } o.dirty=true; return; }
    if(['shColor','shBlur','shX','shY','shAlpha'].includes(p)){ const q=shParts(o)||{c:'#000000',a:0.55,blur:20*K(),x:4*K(),y:6*K()};
      if(p==='shColor')q.c=v||'#000000'; if(p==='shBlur')q.blur=v; if(p==='shX')q.x=v; if(p==='shY')q.y=v; if(p==='shAlpha')q.a=v;
      const n=parseInt(q.c.slice(1),16); o.set('shadow',new fabric.Shadow({color:`rgba(${n>>16&255},${n>>8&255},${n&255},${q.a})`,blur:q.blur,offsetX:q.x,offsetY:q.y})); o.dirty=true; return; }

    else if(p==='stroke'&&o.type==='textbox'){ o.set('stroke',v||null); if(v&&!o.strokeWidth) o.set('strokeWidth',6*K()); }
    else if(p==='stroke'&&kindOf(o)==='shape'){ o.set('stroke',v||null); if(v&&!o.strokeWidth) o.set({strokeWidth:6*K(),strokeUniform:true}); }
    else o.set(p,p==='fill'&&!v?'':v);

async function addFontFile(file){
  if(!file) return; if(!/\.(ttf|otf|woff2?)$/i.test(file.name)){ toast('ফন্ট ফাইল দিন: .ttf, .otf, .woff বা .woff2'); return; }
  let family=file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/["'\\]/g,'').trim().slice(0,60)||'My Font';
  if(FONTS.some(f=>f[0]===family&&f[1]!=='custom')) family+=' (আপনার)';
  try{ const buf=await file.arrayBuffer(); await registerFont(family,buf.slice(0));
    try{ await fontStore('readwrite',st=>st.put(buf,family)); }catch(e){}
    if(targets().some(o=>o.type==='textbox')) await setFont(family);
    renderPanel(); toast(`“${family}” ফন্ট যোগ হয়েছে`);
  }catch(e){ toast('এই ফন্ট ফাইলটি খোলা গেল না। অন্য ফাইল চেষ্টা করুন।'); } }

  for(const k of keys){ const buf=await new Promise(r=>{const q=db.transaction('fonts').objectStore('fonts').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}); if(buf) try{ await registerFont(String(k),buf); }catch(e){} }

async function runItems(items,work){
  const b=base(); work=work||await getBaseWork(b);

  for(const it of items.texts||[]){ const r=processText(work,it); if(r) texts.push(r); await sleep(0); }
  for(const it of items.graphics||[]){ const r=processGraphic(work,it); if(r) graphics.push(r); await sleep(0); }
  await commitBase(b,work);
  const m=imgMap(b); S.batch=true;

      img.set({kind:'image',found:true,assetId:id,layerName:g.label,fx:{},originX:'center',originY:'center',scaleX:m.s,scaleY:b.scaleY,flipX:b.flipX,flipY:b.flipY,

  const wrap=canvas.wrapperEl; let pinch=null,pan=null,down=null;
  const rel=(t)=>{ const r=canvas.upperCanvasEl.getBoundingClientRect(); return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  function cancelFabric(){ const t=canvas._currentTransform; if(t&&t.target&&t.original){ t.target.set({left:t.original.left,top:t.original.top,scaleX:t.original.scaleX,scaleY:t.original.scaleY,angle:t.original.angle}); t.target.setCoords(); }
    canvas._currentTransform=null; if(canvas.isDrawingMode&&canvas._isCurrentlyDrawing){ S.dropPath=true; } canvas.clearContext(canvas.contextTop); canvas.requestRenderAll(); }
  let before=null,gesture=false;
  wrap.addEventListener('touchstart',e=>{ if(e.touches.length===1&&!gesture){ before=canvas.getActiveObject()||null; }
    if(gesture){ e.preventDefault(); e.stopPropagation(); }
    if(e.touches.length>=2){ e.preventDefault(); e.stopPropagation(); cancelFabric(); pan=null; gesture=true;
      const now=canvas.getActiveObject()||null; if(now!==before){ if(before&&canvas.getObjects().includes(before)) canvas.setActiveObject(before); else canvas.discardActiveObject(); }
      const a=rel(e.touches[0]),b=rel(e.touches[1]); pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,z:canvas.getZoom()}; } },{capture:true,passive:false});
  wrap.addEventListener('touchmove',e=>{ if(!gesture)return; e.preventDefault(); e.stopPropagation(); if(!pinch||e.touches.length<2)return;
      const a=rel(e.touches[0]),b=rel(e.touches[1]); const d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
      canvas.relativePan(new fabric.Point(cx-pinch.cx,cy-pinch.cy)); zoomAt(pinch.z*d/pinch.d,cx,cy); pinch.cx=cx; pinch.cy=cy; },{capture:true,passive:false});
  const tend=e=>{ if(!gesture)return; e.preventDefault(); e.stopPropagation(); if(e.touches.length<2) pinch=null; if(e.touches.length===0){ gesture=false; canvas.requestRenderAll(); } };
  wrap.addEventListener('touchend',tend,{capture:true}); wrap.addEventListener('touchcancel',tend,{capture:true});
  wrap.addEventListener('wheel',e=>{ e.preventDefault(); const p=rel(e);
      if(e.ctrlKey||e.metaKey){ zoomAt(canvas.getZoom()*Math.exp(-clamp(e.deltaY,-60,60)*0.01),p.x,p.y); }
      else { canvas.relativePan(new fabric.Point(-e.deltaX,-e.deltaY)); canvas.requestRenderAll(); } },{passive:false});

  // a first touch on an object only selects it (and lets the finger pan); it moves on the next drag once selected
  let wasActive=null;

  canvas.on('mouse:down:before',o=>{ wasActive=canvas.getActiveObject()||null; canvas.selection=!isTouch(o.e)&&S.tool!=='hand'&&!canvas.isDrawingMode; });
  canvas.on('mouse:down',o=>{ const p=canvas.getPointer(o.e,true); down=isTouch(o.e)?{x:p.x,y:p.y}:null;
    if(S.tool==='hand'||(o.e&&o.e.button===1)){ canvas._currentTransform=null; pan={x:p.x,y:p.y}; canvas.setCursor('grabbing'); return; }
    if(!isTouch(o.e)) return; // mouse: drag moves objects, drag on empty space draws a selection box
    if(canvas.isDrawingMode||pinch) return;
    const t=o.target, fresh=t&&t!==wasActive&&t.name!=='__crop'&&!(wasActive&&wasActive.type==='activeSelection'&&wasActive.contains&&wasActive.contains(t));

    if(!t||fresh){ pan={x:p.x,y:p.y}; } });
  canvas.on('mouse:move',o=>{ if(!pan||pinch)return; const p=canvas.getPointer(o.e,true); canvas.relativePan(new fabric.Point(p.x-pan.x,p.y-pan.y)); pan={x:p.x,y:p.y}; canvas.requestRenderAll(); });
  canvas.on('mouse:up',()=>{ pan=null; down=null; });
  // ignore tiny finger wobble so a tap on text does not move it
  canvas.on('object:moving',e=>{ const t=e.transform; if(!down||!t||!t.original)return; const p=canvas.getPointer(e.e,true);
    if(Math.hypot(p.x-down.x,p.y-down.y)<9){ e.target.set({left:t.original.left,top:t.original.top}); } else down=null; });

  let lastTap=0; canvas.on('mouse:up',o=>{ if(o.target||canvas.isDrawingMode)return; const n=Date.now(); if(n-lastTap<300){ fitView(); lastTap=0; } else lastTap=n; });
})();

S.guides=true; S.guideLines=[]; S.tool='select'; S.clip=null;
function selObjs(){ const a=canvas.getActiveObject(); if(!a||a.isBase) return []; return a.type==='activeSelection'?a.getObjects().slice():[a]; }
function reselect(objs){ objs=objs.filter(o=>canvas.getObjects().includes(o)); if(!objs.length){canvas.discardActiveObject();} else if(objs.length===1) canvas.setActiveObject(objs[0]); else canvas.setActiveObject(new fabric.ActiveSelection(objs,{canvas})); canvas.requestRenderAll(); }
function alignObjs(mode){ const objs=selObjs(); if(!objs.length){toast('আগে কিছু বাছাই করুন');return}
  canvas.discardActiveObject(); const rs=objs.map(o=>o.getBoundingRect(true,true));
  const B=objs.length===1?{l:0,t:0,r:S.W,b:S.H}:{l:Math.min(...rs.map(r=>r.left)),t:Math.min(...rs.map(r=>r.top)),r:Math.max(...rs.map(r=>r.left+r.width)),b:Math.max(...rs.map(r=>r.top+r.height))};
  if(mode==='dh'||mode==='dv'){ if(objs.length<3){toast('সমান দূরত্বের জন্য অন্তত ৩টি বস্তু বাছাই করুন');reselect(objs);return}
    const H=mode==='dh', idx=objs.map((o,i)=>i).sort((i,j)=>H?rs[i].left-rs[j].left:rs[i].top-rs[j].top);
    const span=H?B.r-B.l:B.b-B.t, sum=rs.reduce((s2,r)=>s2+(H?r.width:r.height),0), gap=(span-sum)/(objs.length-1); let pos=H?B.l:B.t;
    idx.forEach(i=>{ const o=objs[i],r=rs[i]; if(H) o.left+=pos-r.left; else o.top+=pos-r.top; pos+=(H?r.width:r.height)+gap; o.setCoords(); }); }

    if(mode==='t') o.top+=B.t-r.top; if(mode==='cv') o.top+=(B.t+B.b)/2-(r.top+r.height/2); if(mode==='b') o.top+=B.b-(r.top+r.height); o.setCoords(); });

canvas.on('object:moving',e=>{ const o=e.target; S.guideLines=[]; if(!S.guides||!o||o.isBase||o.name==='__crop') return;
  const th=7/canvas.getZoom(), br=o.getBoundingRect(true,true), xs=[br.left,br.left+br.width/2,br.left+br.width], ys=[br.top,br.top+br.height/2,br.top+br.height];
  const tx=[0,S.W/2,S.W], ty=[0,S.H/2,S.H]; const mine=new Set(o.type==='activeSelection'?o.getObjects():[o]);
  canvas.getObjects().forEach(x=>{ if(mine.has(x)||x.isBase||x.visible===false||x.name==='__crop') return; const r=x.getBoundingRect(true,true); tx.push(r.left,r.left+r.width/2,r.left+r.width); ty.push(r.top,r.top+r.height/2,r.top+r.height); });

  ys.forEach(a=>ty.forEach(t=>{ const d=t-a; if(Math.abs(d)<th&&(!by||Math.abs(d)<Math.abs(by.d))) by={d,t}; }));

canvas.on('after:render',e=>{ const ctx=e&&e.ctx; if(!ctx||ctx!==canvas.contextContainer||!S.guideLines.length) return; const v=canvas.viewportTransform;
  ctx.save(); ctx.strokeStyle='#ff2bd6'; ctx.lineWidth=1; ctx.beginPath();

  ctx.stroke(); ctx.restore(); });

    else if(k==='a') id='all'; else if(k==='g') id=sh?'ungroup':'group'; else if(e.key===']'||e.key==='}') id=sh?'front':'fwd'; else if(e.key==='['||e.key==='{') id=sh?'back':'bwd';
    else if(k==='l') id='lock'; else if(e.key==='='||e.key==='+') id='zin'; else if(e.key==='-'||e.key==='_') id='zout'; else if(e.key==='0') id='fit'; else if(e.key==='1') id='z100'; else if(e.key===';') id='guides'; }
  else if(!e.altKey){ if(k==='v'&&!sh) id='t:select'; else if(k==='h'&&!sh) id='t:hand'; else if(k==='t') id='t:text'; else if(k==='r') id='t:rect'; else if(k==='e') id='t:ellipse'; else if(k==='l') id='t:line'; else if(k==='b') id='t:draw';
    else if(k==='c'&&!S.crop) id='t:crop'; else if(sh&&k==='h') id='flipX'; else if(sh&&k==='v') id='flipY'; else if(e.key==='Tab'){ id='panel'; } }
  if(id){ e.preventDefault(); e.stopImmediatePropagation(); runMenu(id); } },true);
document.addEventListener('keyup',e=>{ if(e.key===' '&&S.spacePan){ S.spacePan=false; setTool('select'); } });
/* photos sent through the chat (stored with the artifact) and pasted images */
S.photos=[];
async function initPhotos(){ try{ const db=window.claude&&window.claude.use?await window.claude.use('db'):null; if(!db) return;
  db.collection('photos').orderBy('at','desc').limit(40).onSnapshot(sn=>{ S.photos=sn.docs.map(d=>({id:d.id,...(d.data()||{})})).filter(p=>typeof p.asset==='string');
    if((S.tab==='smart'||S.tab==='image')&&!active()&&!S.crop) renderPanel(); },()=>{}); }catch(e){} }
function photosUI(){ if(!S.photos.length) return '';
  return sec('চ্যাটে পাঠানো ছবি',`<div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(84px,1fr))">${S.photos.map(p=>`<button class="tile ph-t" data-a="photo" data-v="${esc(p.asset)}" aria-label="${esc(p.name||'ছবি')}"><img src="/_blob/${esc(p.asset)}" alt="" loading="lazy"><span>${esc(p.name||'ছবি')}</span></button>`).join('')}</div>`); }
async function loadPhoto(id){ showBusy(true,'ছবি আনছি…','একটু অপেক্ষা করুন।');
  try{ let blob=null; try{ const r=await fetch('/_blob/'+id); if(r.ok) blob=await r.blob(); }catch(e){}
    if(blob&&blob.size){ showBusy(false); await handleFile(blob,false); return; }
    const el=await himg('/_blob/'+id); await loadImgEl(el); }
  catch(e){ toast('ছবিটি আনা গেল না। আবার চেষ্টা করুন।'); }
  finally{ if(S.busy&&!S.ctl) showBusy(false); } }
async function loadImgEl(el){ let w=el.naturalWidth,h=el.naturalHeight; const k=Math.min(1,2048/Math.max(w,h)); w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(el,0,0,w,h); showBusy(false); await setBase(c.toDataURL('image/jpeg',0.92),w,h); }
const pasteBox=()=>`<div class="pastebox" contenteditable="true" data-paste aria-label="ছবি পেস্ট করার জায়গা">গ্যালারি না খুললে: ছবি কপি করে এখানে চেপে ধরে “পেস্ট” করুন</div>`;
panel.addEventListener('input',async e=>{ const box=e.target.closest&&e.target.closest('[data-paste]'); if(!box) return; const img=box.querySelector('img');
  if(img){ const src=img.src; box.textContent=''; try{ const el=await himg(src); await loadImgEl(el);}catch(err){toast('এই ছবিটি পেস্ট করা গেল না।')} } });
panel.addEventListener('paste',e=>{ const box=e.target.closest&&e.target.closest('[data-paste]'); if(!box) return; const it=[...(e.clipboardData?.items||[])].find(i=>i.kind==='file');
  if(it){ e.preventDefault(); e.stopPropagation(); handleFile(it.getAsFile(),false); } },true);
async function init(){
  applySheet();layoutCanvas();renderPanel();updUndo();
  loadSavedFonts();
  initPhotos();
  try{ const loads=[];FONTS.forEach(([f,l])=>{try{loads.push(document.fonts.load(`400 40px "${f}"`,l==='bn'?'অআকখ':'Abc'));loads.push(document.fonts.load(`700 40px "${f}"`,l==='bn'?'অআকখ':'Abc'))}catch(e){}});
    await Promise.race([Promise.allSettled(loads),sleep(3000)]); }catch(e){}
  try{
    S.isSample=true;
    const smp=await makeSample();
    await setBase(smp.url,1080,1350,{sample:true});
    const hs=wordHints(smp.items.texts.map(t=>({text:t.text,bbox:t.px,words:t.words})));
    hs.forEach(h=>{ const t=smp.items.texts.find(t=>t.text===h.lineText); if(t){ h.font=t.font; h.weight=t.weight; h.fontKnown=true; h.trustColor=true; h.color=t.color; } });
    setHints([...hs,...smp.items.graphics.map(g=>({type:'graphic',label:g.label,px:g.px}))]);
    S.smart={state:'hints'};
  }catch(e){ S.isSample=false; S.batch=false; $('#chip').hidden=true; console.error(e); }
  S.hist=[];S.hi=-1;save();renderPanel();updBar();
  window.__openShared=async()=>{ try{ const r=await fetch('shared-image?t='+Date.now()); if(r.ok){ const bl=await r.blob(); if(bl.size) await handleFile(bl,false,true); } }catch(e){ toast('ছবিটি খোলা গেল না'); } };
  if(APP&&window.Android.hasShared&&window.Android.hasShared()) await window.__openShared();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(fabric.util.clearFabricFontCache)fabric.util.clearFabricFontCache(); canvas.getObjects().forEach(o=>{if(o.initDimensions){o.initDimensions();o.setCoords()}}); canvas.requestRenderAll(); });
}
init();
})();
</script>
